services:
  gateway:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      GATEWAY_CONFIG_FILE: /app/config/gateway.example.yaml
      GATEWAY_DB_PATH: /app/data/gateway.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - gateway
